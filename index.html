<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>TOTP Offline</title>
<style>
:root{color-scheme:dark;--bg:#0d100d;--panel:#171b16;--line:#343b31;--ink:#f3f0df;--muted:#a9ad9f;--accent:#d6a85f;--bad:#ef8177}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{width:min(620px,calc(100% - 28px));border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:20px}
h1{margin:0 0 6px;font:600 24px Georgia,serif;color:var(--accent)}
p{margin:6px 0 16px;color:var(--muted)}
label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px}
input,select,button{font:inherit}
input,select{width:100%;border:1px solid var(--line);background:#090b09;color:var(--ink);border-radius:8px;padding:11px}
button{border:1px solid var(--line);background:#252b23;color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.codebox{margin:18px 0 8px;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;background:#10140f}
.code{font:700 clamp(34px,9vw,54px)/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em}
.timer{margin-top:10px;color:var(--muted);font:13px ui-monospace,monospace}
.actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--accent)}
.status{min-height:22px;margin-top:10px;color:var(--muted)}
.status.bad{color:var(--bad)}
small{display:block;margin-top:16px;color:var(--muted)}
@media(max-width:560px){.row{grid-template-columns:1fr}.code{letter-spacing:.08em}}
</style>
</head>
<body>
<main>
  <h1>TOTP Offline</h1>
  <p>Pega el seed Base32. Todo se calcula en este navegador; este archivo no hace conexiones de red ni guarda el seed.</p>

  <label for="seed">Seed Base32</label>
  <input id="seed" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="JBSWY3DPEHPK3PXP">

  <div class="codebox">
    <div id="code" class="code">------</div>
    <div id="timer" class="timer">esperando seed</div>
    <div class="actions">
      <button id="copy" type="button">Copiar código</button>
      <button id="clear" type="button">Limpiar</button>
    </div>
  </div>

  <details>
    <summary>Parámetros avanzados</summary>
    <div class="row">
      <div>
        <label for="algorithm">Algoritmo</label>
        <select id="algorithm">
          <option value="SHA-1" selected>SHA-1</option>
          <option value="SHA-256">SHA-256</option>
          <option value="SHA-512">SHA-512</option>
        </select>
      </div>
      <div>
        <label for="digits">Dígitos</label>
        <select id="digits">
          <option value="6" selected>6</option>
          <option value="8">8</option>
        </select>
      </div>
      <div>
        <label for="period">Periodo</label>
        <select id="period">
          <option value="30" selected>30 s</option>
          <option value="60">60 s</option>
        </select>
      </div>
    </div>
  </details>

  <div id="status" class="status"></div>
  <small>Archivo autocontenido. Sin analytics, CDN, backend, localStorage, cookies ni llamadas de red.</small>
</main>

<script>
'use strict';

const seedEl = document.getElementById('seed');
const codeEl = document.getElementById('code');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const algorithmEl = document.getElementById('algorithm');
const digitsEl = document.getElementById('digits');
const periodEl = document.getElementById('period');

function normalizeBase32(value) {
  return String(value || '').toUpperCase().replace(/[^A-Z2-7]/g, '');
}

function decodeBase32(value) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = normalizeBase32(value);
  if (!clean) throw new Error('Pega un seed Base32.');

  let buffer = 0;
  let bits = 0;
  const output = [];

  for (const char of clean) {
    const n = alphabet.indexOf(char);
    if (n < 0) throw new Error('Seed Base32 inválido.');
    buffer = (buffer << 5) | n;
    bits += 5;

    while (bits >= 8) {
      output.push((buffer >>> (bits - 8)) & 0xff);
      bits -= 8;
      buffer = bits ? buffer & ((1 << bits) - 1) : 0;
    }
  }

  if (!output.length) throw new Error('Seed Base32 demasiado corto.');
  return new Uint8Array(output);
}

function counterBytes(counter) {
  let n = BigInt(counter);
  const bytes = new Uint8Array(8);
  for (let i = 7; i >= 0; i--) {
    bytes[i] = Number(n & 255n);
    n >>= 8n;
  }
  return bytes;
}

async function generateTotp(secret, timeMs = Date.now()) {
  if (!globalThis.crypto || !crypto.subtle) {
    throw new Error('Este navegador no ofrece Web Crypto. Prueba Chrome, Edge, Firefox o Safari moderno.');
  }

  const period = Number(periodEl.value);
  const digits = Number(digitsEl.value);
  const algorithm = algorithmEl.value;
  const counter = Math.floor(timeMs / 1000 / period);

  const key = await crypto.subtle.importKey(
    'raw',
    decodeBase32(secret),
    { name: 'HMAC', hash: { name: algorithm } },
    false,
    ['sign']
  );

  const digest = new Uint8Array(
    await crypto.subtle.sign('HMAC', key, counterBytes(counter))
  );

  const offset = digest[digest.length - 1] & 0x0f;
  const binary =
    (((digest[offset] & 0x7f) << 24) |
      (digest[offset + 1] << 16) |
      (digest[offset + 2] << 8) |
      digest[offset + 3]) >>> 0;

  return String(binary % (10 ** digits)).padStart(digits, '0');
}

function formatCode(code) {
  return code.length === 6 ? code.slice(0, 3) + ' ' + code.slice(3) : code.slice(0, 4) + ' ' + code.slice(4);
}

async function render() {
  const raw = seedEl.value;
  const period = Number(periodEl.value);
  const seconds = Math.floor(Date.now() / 1000);
  const remaining = period - (seconds % period);

  if (!normalizeBase32(raw)) {
    codeEl.textContent = '------';
    timerEl.textContent = 'esperando seed';
    statusEl.textContent = '';
    statusEl.className = 'status';
    return;
  }

  try {
    const code = await generateTotp(raw);
    codeEl.textContent = formatCode(code);
    codeEl.dataset.raw = code;
    timerEl.textContent = 'vence en ' + remaining + ' s';
    statusEl.textContent = '';
    statusEl.className = 'status';
  } catch (error) {
    codeEl.textContent = 'ERROR';
    delete codeEl.dataset.raw;
    timerEl.textContent = '';
    statusEl.textContent = error && error.message ? error.message : 'No se pudo generar el TOTP.';
    statusEl.className = 'status bad';
  }
}

document.getElementById('copy').addEventListener('click', async () => {
  const value = codeEl.dataset.raw;
  if (!value) return;
  try {
    await navigator.clipboard.writeText(value);
    statusEl.textContent = 'Código copiado.';
    statusEl.className = 'status';
  } catch {
    statusEl.textContent = 'No se pudo usar el portapapeles; copia el código manualmente.';
    statusEl.className = 'status bad';
  }
});

document.getElementById('clear').addEventListener('click', () => {
  seedEl.value = '';
  delete codeEl.dataset.raw;
  render();
  seedEl.focus();
});

seedEl.addEventListener('input', render);
algorithmEl.addEventListener('change', render);
digitsEl.addEventListener('change', render);
periodEl.addEventListener('change', render);

setInterval(render, 500);
render();
</script>
</body>
</html>
